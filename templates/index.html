<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>FaceID — Real-Time Recognition</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;800&display=swap" rel="stylesheet"/>
<style>
  /* ── DESIGN TOKENS ─────────────────────────────────────────── */
  :root {
    --bg:        #050810;
    --surface:   #0c1120;
    --border:    #1e2d4a;
    --accent:    #00e5ff;
    --accent2:   #7c3aed;
    --green:     #00ff88;
    --red:       #ff3366;
    --yellow:    #ffd700;
    --text:      #e8f0fe;
    --muted:     #4a6080;
    --font-ui:   'Syne', sans-serif;
    --font-mono: 'Space Mono', monospace;
    --radius:    6px;
    --panel-w:   280px;
  }

  /* ── RESET ─────────────────────────────────────────────────── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: var(--font-ui); }

  /* ── SCAN-LINE OVERLAY ──────────────────────────────────────── */
  body::before {
    content: '';
    position: fixed; inset: 0; z-index: 999; pointer-events: none;
    background: repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,229,255,.015) 2px,rgba(0,229,255,.015) 4px);
  }

  /* ── LAYOUT ─────────────────────────────────────────────────── */
  .app {
    display: grid;
    grid-template-rows: 52px 1fr;
    grid-template-columns: 1fr var(--panel-w);
    height: 100vh;
    gap: 0;
  }

  /* ── HEADER ─────────────────────────────────────────────────── */
  header {
    grid-column: 1 / -1;
    display: flex; align-items: center; gap: 16px;
    padding: 0 20px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    position: relative; z-index: 10;
  }
  .logo {
    font-size: 1.1rem; font-weight: 800; letter-spacing: .12em; text-transform: uppercase;
    color: var(--accent); font-family: var(--font-mono);
  }
  .logo span { color: var(--accent2); }
  .status-pill {
    display: flex; align-items: center; gap: 6px;
    font-size: .7rem; font-family: var(--font-mono); color: var(--muted);
    margin-left: auto;
  }
  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--muted); transition: background .3s;
  }
  .dot.live { background: var(--green); box-shadow: 0 0 8px var(--green); animation: pulse 1.4s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

  /* Stats strip in header */
  .hdr-stats {
    display: flex; gap: 20px; margin-left: 24px;
  }
  .hdr-stat { font-size: .65rem; font-family: var(--font-mono); color: var(--muted); }
  .hdr-stat b { color: var(--accent); font-size: .8rem; }

  /* ── VIDEO AREA ──────────────────────────────────────────────── */
  .cam-area {
    position: relative; overflow: hidden;
    background: #000;
    display: flex; align-items: center; justify-content: center;
  }
  #video {
    width: 100%; height: 100%;
    object-fit: cover;
    transform: scaleX(-1); /* mirror for selfie cam */
  }
  #overlay {
    position: absolute; inset: 0;
    pointer-events: none;
  }

  /* Corner bracket decorations */
  .cam-area::before, .cam-area::after,
  .cam-corner-br, .cam-corner-bl {
    content: '';
    position: absolute; width: 28px; height: 28px;
    border-color: var(--accent); border-style: solid;
    opacity: .6; pointer-events: none; z-index: 5;
  }
  .cam-area::before { top:12px; left:12px; border-width:2px 0 0 2px; }
  .cam-area::after  { top:12px; right:12px; border-width:2px 2px 0 0; }
  .cam-corner-br    { bottom:12px; right:12px; border-width:0 2px 2px 0; position:absolute; z-index:5; }
  .cam-corner-bl    { bottom:12px; left:12px;  border-width:0 0 2px 2px; position:absolute; z-index:5; }

  /* Scanning sweep line */
  .scan-line {
    position: absolute; left:0; right:0; height:2px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    opacity: 0; pointer-events: none; z-index: 4;
    animation: sweep 3s ease-in-out infinite;
  }
  @keyframes sweep {
    0%   { top:0%;   opacity:0; }
    10%  { opacity:.7; }
    90%  { opacity:.7; }
    100% { top:100%; opacity:0; }
  }

  /* ── FIXED REGISTER PANEL (replaces floating overlays) ──────── */
  #registerPanel {
    display: none;
    position: fixed;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 100;
    background: rgba(5, 8, 16, 0.96);
    border: 1px solid var(--red);
    border-radius: 10px;
    padding: 14px 20px;
    backdrop-filter: blur(16px);
    box-shadow: 0 0 32px rgba(255,51,102,.35), 0 8px 32px rgba(0,0,0,.6);
    min-width: 320px;
    pointer-events: all;
    animation: slideUp .2s ease;
  }
  @keyframes slideUp {
    from { opacity:0; transform: translateX(-50%) translateY(12px); }
    to   { opacity:1; transform: translateX(-50%) translateY(0); }
  }
  #registerPanel.visible { display: block; }

  #registerPanel .reg-title {
    font-size: .62rem; letter-spacing: .12em; text-transform: uppercase;
    color: var(--red); font-family: var(--font-mono); margin-bottom: 10px;
    display: flex; align-items: center; gap: 8px;
  }
  #registerPanel .reg-title::before {
    content: ''; display: inline-block;
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--red); animation: pulse 1s infinite;
  }
  #registerPanel .reg-count {
    color: var(--muted); margin-left: auto; font-size: .6rem;
  }
  #registerPanel .reg-row {
    display: flex; gap: 8px; align-items: center;
  }
  #registerPanel input {
    flex: 1;
    background: rgba(255,255,255,.07);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text); font-family: var(--font-mono); font-size: .8rem;
    padding: 9px 12px; outline: none;
    transition: border-color .2s, box-shadow .2s;
  }
  #registerPanel input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 2px rgba(0,229,255,.15);
  }
  #registerPanel input::placeholder { color: var(--muted); }
  #registerPanel .reg-save {
    background: var(--green); color: #000;
    border: none; border-radius: 6px;
    font-family: var(--font-mono); font-size: .75rem; font-weight: 700;
    padding: 9px 18px; cursor: pointer;
    transition: opacity .15s, transform .1s;
    white-space: nowrap;
  }
  #registerPanel .reg-save:hover { opacity: .85; }
  #registerPanel .reg-save:active { transform: scale(.96); }
  #registerPanel .reg-save.saving { opacity: .5; pointer-events: none; }
  #registerPanel .reg-dismiss {
    background: transparent; border: 1px solid var(--border);
    border-radius: 6px; color: var(--muted);
    font-family: var(--font-mono); font-size: .68rem;
    padding: 9px 10px; cursor: pointer;
    transition: border-color .2s, color .2s;
  }
  #registerPanel .reg-dismiss:hover { border-color: var(--red); color: var(--red); }

  /* ── SIDE PANEL ──────────────────────────────────────────────── */
  .panel {
    background: var(--surface);
    border-left: 1px solid var(--border);
    display: flex; flex-direction: column;
    overflow: hidden;
  }

  .panel-section {
    padding: 16px;
    border-bottom: 1px solid var(--border);
  }
  .panel-label {
    font-size: .62rem; letter-spacing: .12em; text-transform: uppercase;
    color: var(--muted); font-family: var(--font-mono); margin-bottom: 10px;
  }

  /* Mode toggle */
  .toggle-row { display: flex; gap: 8px; }
  .toggle-btn {
    flex:1; padding: 7px; font-family: var(--font-mono); font-size: .68rem;
    border: 1px solid var(--border); border-radius: var(--radius);
    background: transparent; color: var(--muted); cursor: pointer;
    transition: all .2s;
  }
  .toggle-btn.active { background: var(--accent2); color: #fff; border-color: var(--accent2); }

  /* Interval slider */
  .slider-row { display: flex; flex-direction:column; gap: 6px; }
  .slider-row label { font-size: .65rem; font-family: var(--font-mono); color: var(--muted); }
  .slider-row label span { color: var(--accent); }
  input[type=range] {
    -webkit-appearance: none; width: 100%; height: 3px;
    background: var(--border); border-radius: 2px; outline: none;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 14px; height: 14px;
    border-radius: 50%; background: var(--accent); cursor: pointer;
  }

  /* Confidence threshold */
  .threshold-row { display: flex; flex-direction:column; gap: 6px; margin-top: 12px; }

  /* Face list */
  .face-list-wrap { flex:1; overflow-y: auto; padding: 12px 16px; }
  .face-list-wrap::-webkit-scrollbar { width: 4px; }
  .face-list-wrap::-webkit-scrollbar-track { background: transparent; }
  .face-list-wrap::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .face-item {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 10px; border-radius: var(--radius);
    margin-bottom: 4px; background: rgba(255,255,255,.03);
    border: 1px solid transparent;
    transition: border-color .2s, background .2s;
    animation: fadeIn .3s ease;
  }
  @keyframes fadeIn { from{opacity:0;transform:translateY(4px)} to{opacity:1;transform:none} }
  .face-item:hover { border-color: var(--border); background: rgba(255,255,255,.06); }
  .face-avatar {
    width: 28px; height: 28px; border-radius: 50%;
    background: var(--accent2); display: flex; align-items: center; justify-content: center;
    font-size: .75rem; font-weight: 700; color: #fff; flex-shrink: 0;
  }
  .face-name { font-size: .8rem; font-weight: 600; flex:1; }
  .face-id   { font-size: .6rem; font-family: var(--font-mono); color: var(--muted); }
  .face-del  {
    background: transparent; border: none; color: var(--muted); cursor: pointer;
    font-size: .8rem; transition: color .15s; padding: 2px 4px;
  }
  .face-del:hover { color: var(--red); }

  /* ── BOTTOM LOG ──────────────────────────────────────────────── */
  .log-strip {
    padding: 8px 16px;
    border-top: 1px solid var(--border);
    font-size: .62rem; font-family: var(--font-mono); color: var(--muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    background: rgba(0,229,255,.03);
  }
  .log-strip .log-ts { color: var(--accent2); margin-right: 6px; }
  .log-strip .log-ok { color: var(--green); }
  .log-strip .log-warn { color: var(--yellow); }

  /* ── START SCREEN ────────────────────────────────────────────── */
  .start-screen {
    position: absolute; inset: 0; z-index: 30;
    background: var(--bg);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 20px;
    text-align: center;
  }
  .start-screen h2 {
    font-size: 1.4rem; font-weight: 800; color: var(--accent);
    font-family: var(--font-mono); letter-spacing: .08em;
  }
  .start-screen p { font-size: .85rem; color: var(--muted); max-width: 280px; line-height: 1.6; }
  .start-btn {
    background: var(--accent); color: var(--bg);
    border: none; border-radius: var(--radius);
    font-family: var(--font-mono); font-size: .85rem; font-weight: 700;
    padding: 12px 32px; cursor: pointer; letter-spacing: .06em;
    transition: opacity .2s, transform .15s;
    box-shadow: 0 0 24px rgba(0,229,255,.3);
  }
  .start-btn:hover { opacity: .85; transform: translateY(-2px); }

  /* ── LOADING / ERROR TOAST ───────────────────────────────────── */
  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: var(--surface); border: 1px solid var(--border);
    color: var(--text); font-family: var(--font-mono); font-size: .75rem;
    padding: 10px 20px; border-radius: var(--radius);
    z-index: 200; opacity: 0; pointer-events: none;
    transition: opacity .3s;
  }
  .toast.show { opacity: 1; }
  .toast.error { border-color: var(--red); color: var(--red); }
  .toast.success { border-color: var(--green); color: var(--green); }

  /* ── MOBILE RESPONSIVE ───────────────────────────────────────── */
  @media (max-width: 640px) {
    :root { --panel-w: 0px; }
    .app { grid-template-columns: 1fr; grid-template-rows: 48px 1fr 200px; }
    .panel {
      grid-row: 3; border-left: none;
      border-top: 1px solid var(--border);
      flex-direction: row; overflow-x: auto;
    }
    .panel-section { border-right: 1px solid var(--border); border-bottom: none; min-width: 180px; }
    .face-list-wrap { flex-direction: row; display:flex; gap:8px; overflow-x: auto; overflow-y: hidden; padding: 10px; }
    .face-item { margin-bottom:0; min-width:120px; flex-direction:column; text-align:center; }
    .hdr-stats { display: none; }
  }
</style>
</head>
<body>

<div class="app">

  <!-- HEADER -->
  <header>
    <div class="logo">Face<span>ID</span></div>
    <div class="hdr-stats">
      <div class="hdr-stat">FACES <b id="hFaces">0</b></div>
      <div class="hdr-stat">KNOWN <b id="hKnown" style="color:var(--green)">0</b></div>
      <div class="hdr-stat">FPS <b id="hFps">—</b></div>
      <div class="hdr-stat">LATENCY <b id="hLatency">—</b></div>
    </div>
    <div class="status-pill">
      <div class="dot" id="statusDot"></div>
      <span id="statusText">OFFLINE</span>
    </div>
  </header>

  <!-- VIDEO AREA -->
  <div class="cam-area" id="camArea">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="overlay"></canvas>
    <div class="cam-corner-br"></div>
    <div class="cam-corner-bl"></div>
    <div class="scan-line"></div>

    <!-- Start screen -->
    <div class="start-screen" id="startScreen">
      <h2>[ FACEID ]</h2>
      <p>Real-time face recognition powered by FaceNet + MTCNN. Grant camera access to begin.</p>
      <button class="start-btn" onclick="startCamera()">ACTIVATE CAMERA</button>
    </div>
  </div>

  <!-- SIDE PANEL -->
  <aside class="panel">
    <div class="panel-section">
      <div class="panel-label">Detection Mode</div>
      <div class="toggle-row">
        <button class="toggle-btn active" id="modeReal" onclick="setMode('real')">LIVE</button>
        <button class="toggle-btn"        id="modeMock" onclick="setMode('mock')">DEMO</button>
      </div>
    </div>

    <div class="panel-section">
      <div class="panel-label">Settings</div>
      <div class="slider-row">
        <label>Interval: <span id="intervalVal">800</span>ms</label>
        <input type="range" id="intervalSlider" min="300" max="3000" step="100" value="800"
               oninput="updateInterval(this.value)"/>
      </div>
      <div class="threshold-row slider-row">
        <label>Threshold: <span id="threshVal">0.55</span></label>
        <input type="range" id="threshSlider" min="0.30" max="0.90" step="0.05" value="0.55"
               oninput="updateThreshold(this.value)"/>
      </div>
    </div>

    <div class="panel-section" style="flex:1; overflow:hidden; display:flex; flex-direction:column;">
      <div class="panel-label">Known Faces <span id="faceCount" style="color:var(--accent)">0</span></div>
      <div class="face-list-wrap" id="faceList"></div>
    </div>

    <div class="log-strip" id="logStrip">
      <span class="log-ts">--:--:--</span>System ready.
    </div>
  </aside>

</div><!-- .app -->

<!-- TOAST -->
<div class="toast" id="toast"></div>

<!-- FIXED REGISTER PANEL — shown when unknown face(s) detected -->
<div id="registerPanel">
  <div class="reg-title">
    Unknown Face Detected
    <span class="reg-count" id="regCount"></span>
  </div>
  <div class="reg-row">
    <input type="text" id="regInput" placeholder="Enter name to register…" autocomplete="off"/>
    <button class="reg-save" id="regSaveBtn" onclick="saveFromPanel()">SAVE</button>
    <button class="reg-dismiss" onclick="dismissPanel()" title="Dismiss">✕</button>
  </div>
</div>

<script>
/* ═══════════════════════════════════════════════════════════════════════
   STATE
═══════════════════════════════════════════════════════════════════════ */
let mode          = 'real';   // 'real' | 'mock'
let running       = false;
let loopInterval  = null;
let INTERVAL_MS   = 800;
let THRESHOLD     = 0.55;
let lastFrameData = null;     // raw base64 of last sent frame

const video   = document.getElementById('video');
const canvas  = document.getElementById('overlay');
const ctx     = canvas.getContext('2d');
const camArea = document.getElementById('camArea');

/* active unknown faces waiting to be named — stores their boxes */
let unknownQueue  = [];   // [{box, key}]
let panelDismissed = false;

/* FPS tracking */
let fpsTs = performance.now(), fpsCount = 0;

/* ═══════════════════════════════════════════════════════════════════════
   CAMERA
═══════════════════════════════════════════════════════════════════════ */
async function startCamera() {
  try {
    const constraints = {
      video: {
        facingMode: { ideal: 'user' },
        width:  { ideal: 1280 },
        height: { ideal: 720 }
      }
    };
    const stream = await navigator.mediaDevices.getUserMedia(constraints);
    video.srcObject = stream;
    await video.play();

    document.getElementById('startScreen').style.display = 'none';
    document.getElementById('statusDot').classList.add('live');
    document.getElementById('statusText').textContent = 'LIVE';

    // Resize canvas to match video
    video.addEventListener('loadedmetadata', resizeCanvas);
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    running = true;
    loadFaceList();
    scheduleLoop();
    log('Camera activated', 'ok');
  } catch (err) {
    showToast('Camera error: ' + err.message, 'error');
    log('Camera error: ' + err.message, 'warn');
  }
}

function resizeCanvas() {
  const rect = camArea.getBoundingClientRect();
  canvas.width  = rect.width;
  canvas.height = rect.height;
}

/* ═══════════════════════════════════════════════════════════════════════
   CAPTURE FRAME
═══════════════════════════════════════════════════════════════════════ */
function captureFrame() {
  const tmp = document.createElement('canvas');
  tmp.width  = video.videoWidth  || canvas.width;
  tmp.height = video.videoHeight || canvas.height;
  const tc   = tmp.getContext('2d');
  // un-mirror before sending to backend
  tc.translate(tmp.width, 0);
  tc.scale(-1, 1);
  tc.drawImage(video, 0, 0, tmp.width, tmp.height);
  return tmp.toDataURL('image/jpeg', 0.7);
}

/* ═══════════════════════════════════════════════════════════════════════
   MAIN DETECTION LOOP
═══════════════════════════════════════════════════════════════════════ */
function scheduleLoop() {
  if (loopInterval) clearInterval(loopInterval);
  loopInterval = setInterval(detectLoop, INTERVAL_MS);
}

async function detectLoop() {
  if (!running) return;
  const t0 = performance.now();

  let faces;
  if (mode === 'mock') {
    faces = getMockFaces();
  } else {
    const frame = captureFrame();
    lastFrameData = frame;
    try {
      const res  = await fetch('/api/recognize', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ image: frame })
      });
      const data = await res.json();
      faces = data.faces || [];
    } catch {
      faces = [];   // backend not ready — silent fail
    }
  }

  // Scale boxes from video-space → display-space
  const scaleX = canvas.width  / (video.videoWidth  || canvas.width);
  const scaleY = canvas.height / (video.videoHeight || canvas.height);
  const scaled = faces.map(f => ({
    ...f,
    box: [
      f.box[0] * scaleX, f.box[1] * scaleY,
      f.box[2] * scaleX, f.box[3] * scaleY
    ]
  }));

  drawFaces(scaled);
  updateRegisterPanel(scaled);

  // FPS
  fpsCount++;
  const now = performance.now();
  if (now - fpsTs >= 1000) {
    document.getElementById('hFps').textContent     = fpsCount;
    document.getElementById('hLatency').textContent = Math.round(now - t0) + 'ms';
    fpsCount = 0; fpsTs = now;
  }
  document.getElementById('hFaces').textContent = scaled.length;
  document.getElementById('hKnown').textContent = scaled.filter(f => f.name !== 'Unknown').length;
}

/* ═══════════════════════════════════════════════════════════════════════
   CANVAS DRAWING
═══════════════════════════════════════════════════════════════════════ */
function drawFaces(faces) {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  faces.forEach(face => {
    const [x1, y1, x2, y2] = face.box;
    const w = x2 - x1, h = y2 - y1;
    const known = face.name && face.name !== 'Unknown';

    const color = known ? '#00ff88' : '#ff3366';
    const glow  = known ? 'rgba(0,255,136,0.3)' : 'rgba(255,51,102,0.3)';

    // Glow rect
    ctx.shadowColor = glow;
    ctx.shadowBlur  = 16;
    ctx.strokeStyle = color;
    ctx.lineWidth   = 2;
    ctx.strokeRect(x1, y1, w, h);
    ctx.shadowBlur  = 0;

    // Corner accents
    const cs = 14;
    ctx.strokeStyle = color;
    ctx.lineWidth   = 3;
    [[x1,y1,1,1],[x2,y1,-1,1],[x1,y2,1,-1],[x2,y2,-1,-1]].forEach(([cx,cy,dx,dy]) => {
      ctx.beginPath();
      ctx.moveTo(cx + dx * cs, cy);
      ctx.lineTo(cx, cy);
      ctx.lineTo(cx, cy + dy * cs);
      ctx.stroke();
    });

    if (known) {
      // Name tag
      const label  = face.name + (face.score ? '  ' + (face.score * 100).toFixed(0) + '%' : '');
      const fSize  = Math.max(11, Math.min(15, w / 9));
      ctx.font     = `700 ${fSize}px 'Space Mono', monospace`;
      const tw     = ctx.measureText(label).width;
      const th     = fSize + 8;
      const tx     = x1;
      const ty     = y1 - th - 2;

      ctx.fillStyle = color;
      ctx.fillRect(tx, ty, tw + 16, th);
      ctx.fillStyle = '#050810';
      ctx.fillText(label, tx + 8, ty + th - 5);
    }
  });
}

/* ═══════════════════════════════════════════════════════════════════════
   FIXED REGISTER PANEL — replaces floating overlays
═══════════════════════════════════════════════════════════════════════ */
const registerPanel = document.getElementById('registerPanel');
const regInput      = document.getElementById('regInput');
const regCount      = document.getElementById('regCount');
const regSaveBtn    = document.getElementById('regSaveBtn');

function updateRegisterPanel(faces) {
  const unknown = faces.filter(f => !f.name || f.name === 'Unknown');

  if (unknown.length === 0) {
    // No unknowns — hide panel, reset dismiss flag
    registerPanel.classList.remove('visible');
    panelDismissed = false;
    unknownQueue   = [];
    return;
  }

  // Store latest boxes so save always uses freshest frame data
  unknownQueue = unknown.map((f, i) => ({ box: f.box, key: i }));

  // Update count badge
  regCount.textContent = unknown.length > 1 ? `${unknown.length} faces` : '1 face';

  // Show panel unless user dismissed it this session
  if (!panelDismissed) {
    registerPanel.classList.add('visible');
    // Auto-focus input only if it's not already focused
    if (document.activeElement !== regInput) {
      // Don't steal focus on every frame — only on first appearance
      if (!registerPanel._focused) {
        regInput.focus();
        registerPanel._focused = true;
      }
    }
  }
}

function dismissPanel() {
  registerPanel.classList.remove('visible');
  registerPanel._focused = false;
  panelDismissed = true;
}

async function saveFromPanel() {
  const name = regInput.value.trim();
  if (!name) {
    regInput.focus();
    regInput.style.borderColor = 'var(--red)';
    setTimeout(() => regInput.style.borderColor = '', 800);
    return;
  }

  regSaveBtn.classList.add('saving');
  regSaveBtn.textContent = '...';

  // Use the first unknown face box (most prominent)
  const box     = unknownQueue.length ? unknownQueue[0].box : null;
  const payload = { name, image: lastFrameData || captureFrame(), box };

  try {
    const res  = await fetch('/api/save-face', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    const data = await res.json();
    if (data.success) {
      showToast('Saved: ' + name, 'success');
      log('Registered face: ' + name, 'ok');
      regInput.value = '';
      registerPanel._focused = false;
      // If there are more unknowns left, keep panel open for next name
      if (unknownQueue.length > 1) {
        unknownQueue.shift();
        regCount.textContent = `${unknownQueue.length} face${unknownQueue.length > 1 ? 's' : ''}`;
        regInput.focus();
      } else {
        registerPanel.classList.remove('visible');
        panelDismissed = false;
      }
      loadFaceList();
    } else {
      throw new Error(data.error || 'Save failed');
    }
  } catch (err) {
    showToast(err.message, 'error');
  } finally {
    regSaveBtn.classList.remove('saving');
    regSaveBtn.textContent = 'SAVE';
  }
}

// Allow Enter key to save
regInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') saveFromPanel();
  if (e.key === 'Escape') dismissPanel();
});

/* ═══════════════════════════════════════════════════════════════════════
   FACE LIST (SIDE PANEL)
═══════════════════════════════════════════════════════════════════════ */
async function loadFaceList() {
  try {
    const res  = await fetch('/api/faces');
    const data = await res.json();
    renderFaceList(data.faces || []);
  } catch {
    // backend not ready
  }
}

function renderFaceList(faces) {
  const list = document.getElementById('faceList');
  document.getElementById('faceCount').textContent = faces.length;
  list.innerHTML = '';
  if (!faces.length) {
    list.innerHTML = '<div style="font-size:.7rem;color:var(--muted);font-family:var(--font-mono);padding:8px 0;">No faces registered.</div>';
    return;
  }
  faces.forEach(f => {
    const el = document.createElement('div');
    el.className = 'face-item';
    el.innerHTML = `
      <div class="face-avatar">${f.name.charAt(0).toUpperCase()}</div>
      <div class="face-name">${f.name}</div>
      <div class="face-id">#${f.id}</div>
      <button class="face-del" onclick="deleteFace(${f.id}, this)" title="Delete">✕</button>
    `;
    list.appendChild(el);
  });
}

async function deleteFace(id, btn) {
  btn.style.opacity = '.3';
  try {
    await fetch('/api/faces/' + id, { method: 'DELETE' });
    loadFaceList();
    log('Deleted face #' + id, 'warn');
  } catch {
    btn.style.opacity = '1';
  }
}

/* ═══════════════════════════════════════════════════════════════════════
   MOCK DATA (demo mode)
═══════════════════════════════════════════════════════════════════════ */
let _mockTick = 0;
function getMockFaces() {
  _mockTick++;
  const t = _mockTick * 0.04;
  const W = canvas.width  || 640;
  const H = canvas.height || 480;
  const faces = [
    {
      name: 'Farah',
      score: 0.87,
      box: [
        W * 0.15 + Math.sin(t * 0.8) * 20,
        H * 0.20 + Math.cos(t * 0.5) * 15,
        W * 0.15 + Math.sin(t * 0.8) * 20 + 140,
        H * 0.20 + Math.cos(t * 0.5) * 15 + 170
      ]
    },
    {
      name: 'Unknown',
      score: 0,
      box: [
        W * 0.60 + Math.sin(t * 0.6 + 1) * 18,
        H * 0.25 + Math.cos(t * 0.7 + 2) * 12,
        W * 0.60 + Math.sin(t * 0.6 + 1) * 18 + 130,
        H * 0.25 + Math.cos(t * 0.7 + 2) * 12 + 160
      ]
    }
  ];
  // Occasionally add a third face
  if (Math.sin(t * 0.2) > 0.4) {
    faces.push({
      name: 'Hayam',
      score: 0.79,
      box: [
        W * 0.38 + Math.sin(t * 0.3) * 10,
        H * 0.30 + Math.cos(t * 0.4) * 10,
        W * 0.38 + Math.sin(t * 0.3) * 10 + 120,
        H * 0.30 + Math.cos(t * 0.4) * 10 + 150
      ]
    });
  }
  return faces;
}

/* ═══════════════════════════════════════════════════════════════════════
   CONTROLS
═══════════════════════════════════════════════════════════════════════ */
function setMode(m) {
  mode = m;
  document.getElementById('modeReal').classList.toggle('active', m === 'real');
  document.getElementById('modeMock').classList.toggle('active', m === 'mock');
  // Clear panel when switching
  registerPanel.classList.remove('visible');
  registerPanel._focused = false;
  panelDismissed = false;
  unknownQueue   = [];
  log('Mode: ' + m.toUpperCase(), 'ok');
}

function updateInterval(v) {
  INTERVAL_MS = parseInt(v);
  document.getElementById('intervalVal').textContent = v;
  if (running) scheduleLoop();
}

function updateThreshold(v) {
  THRESHOLD = parseFloat(v);
  document.getElementById('threshVal').textContent = parseFloat(v).toFixed(2);
}

/* ═══════════════════════════════════════════════════════════════════════
   UTILITIES
═══════════════════════════════════════════════════════════════════════ */
let toastTimer;
function showToast(msg, type = '') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className   = 'toast show ' + type;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 3000);
}

function log(msg, type = '') {
  const ts  = new Date().toTimeString().slice(0, 8);
  const cls = type === 'ok' ? 'log-ok' : type === 'warn' ? 'log-warn' : '';
  document.getElementById('logStrip').innerHTML =
    `<span class="log-ts">${ts}</span><span class="${cls}">${msg}</span>`;
}

/* Keep canvas size in sync with video display size */
new ResizeObserver(resizeCanvas).observe(camArea);
</script>
